<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Salaires</title>
    <style>
        /* Styles Globaux */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #222222;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #3a3a3a;
            background-color: #1a1a1a;
            color: white;
            font-size: 14px;
        }

        input::placeholder {
            color: #555;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        /* 1. Page de Connexion */
        .login-container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .login-title {
            color: #f1c40f;
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* 2. Tableau de Bord (Dashboard) */
        .dashboard-container {
            display: none; /* Masqué par défaut */
            width: 100%;
            max-width: 950px;
            background-color: #2a2a2a;
            padding: 25px;
            border-radius: 8px;
        }

        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
        }
        .badge-dev { background-color: #9b59b6; color: #fff; }
        .badge-patron { background-color: #f1c40f; color: #000; }
        .badge-copatron { background-color: #e67e22; color: #fff; }
        .badge-chef { background-color: #2ecc71; color: #fff; }
        .badge-employe { background-color: #3498db; color: #fff; }
        .badge-recru { background-color: #7f8c8d; color: #fff; }

        .btn-logout {
            background-color: #e74c3c;
            width: auto;
            padding: 8px 15px;
            margin: 0;
        }
        .btn-logout:hover { background-color: #c0392b; }

        /* Panneau de Gestion */
        .management-panel {
            border: 2px dashed #f1c40f;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .panel-title {
            color: #f1c40f;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .panel-grid { grid-template-columns: 1fr; }
        }

        .sub-panel {
            background-color: #222222;
            padding: 15px;
            border-radius: 6px;
        }

        /* Section Liste du Personnel */
        .list-title {
            color: #f1c40f;
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #3a3a3a;
        }

        th {
            color: #f1c40f;
            font-weight: bold;
        }

        .salary-input-container {
            display: flex;
            align-items: center;
        }

        .salary-input {
            width: 90px;
            padding: 5px;
            margin: 0 5px 0 0;
            text-align: center;
            background-color: #111;
            color: #2ecc71;
            font-weight: bold;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="login-container" id="loginPage">
        <h1 class="login-title">Gestion des salaires</h1>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <label for="username">Identifiant :</label>
            <input type="text" id="username" placeholder="Ex: ekartin" required>

            <label for="password">Mot de passe :</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit">Se connecter</button>
        </form>
    </div>

    <div class="dashboard-container" id="dashboardPage">
        <div class="header-dash">
            <div>
                Bonjour, <strong id="sessionName">Elyot Kartin</strong> 
                <span id="sessionBadge" class="badge">GRADE</span>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Déconnexion</button>
        </div>

        <div class="management-panel" id="adminPanel">
            <h2 class="panel-title">👑 Panneau de Gestion (Dev / Patron / Co-Patron)</h2>
            
            <div class="panel-grid">
                <div class="sub-panel">
                    <h3>Recruter un employé</h3>
                    <form id="createProfileForm" onsubmit="handleCreateEmployee(event)">
                        <input type="text" id="newFirstName" placeholder="Prénom" required>
                        <input type="text" id="newLastName" placeholder="Nom" required>
                        <input type="password" id="newPassword" placeholder="Mot de passe" required>
                        
                        <label for="newGrade">Grade :</label>
                        <select id="newGrade">
                            <option value="recru">Recru</option>
                            <option value="employé">Employé</option>
                            <option value="chef d'équipe">Chef d'équipe</option>
                            <option value="co-patron">Co-Patron</option>
                            <option value="patron">Patron</option>
                        </select>
                        <button type="submit">Recruter l'employé</button>
                    </form>
                </div>

                <div class="sub-panel">
                    <h3>Gérer un employé</h3>
                    <label for="selectEmployee">Sélectionner l'employé :</label>
                    <select id="selectEmployee" onchange="handleSelectEmployee(this.value)">
                        <option value="">-- Choisir un employé --</option>
                    </select>
                    
                    <div id="employeeActions" style="display:none; margin-top: 15px;">
                        <label for="changeGradeSelect">Modifier le grade :</label>
                        <select id="changeGradeSelect">
                            <option value="recru">Recru</option>
                            <option value="employé">Employé</option>
                            <option value="chef d'équipe">Chef d'équipe</option>
                            <option value="co-patron">Co-Patron</option>
                            <option value="patron">Patron</option>
                            <option value="dev">Dev</option>
                        </select>
                        <button style="background-color: #27ae60; margin-bottom: 10px;" onclick="changeEmployeeGrade()">Valider le changement de grade</button>
                        <button style="background-color: #e74c3c;" onclick="deleteEmployee()">Virer / Supprimer l'employé</button>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="list-title">📊 Liste du Personnel & Salaires</h2>
        <table>
            <thead>
                <tr>
                    <th>Employé</th>
                    <th>Grade</th>
                    <th>Identifiant</th>
                    <th>Salaire ($)</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                </tbody>
        </table>
    </div>

    <script>
        // Ordre hiérarchique des grades pour le tri automatique (Dev en premier)
        const gradeOrder = {
            "dev": 1,
            "patron": 2,
            "co-patron": 3,
            "chef d'équipe": 4,
            "employé": 5,
            "recru": 6
        };

        // Profil par défaut demandé (Grade : Dev)
        let defaultEmployees = [
            { firstname: "Elyot", lastname: "Kartin", username: "ekartin", password: "bonjour", grade: "dev", salary: 0 }
        ];

        // Charger depuis le localStorage ou initialiser
        if (!localStorage.getItem('accounting_system_data')) {
            localStorage.setItem('accounting_system_data', JSON.stringify(defaultEmployees));
        }
        
        let employees = JSON.parse(localStorage.getItem('accounting_system_data'));
        let currentUser = null;

        // Connexion
        function handleLogin(event) {
            event.preventDefault();
            const userIn = document.getElementById('username').value.trim().toLowerCase();
            const passIn = document.getElementById('password').value;

            const found = employees.find(e => e.username === userIn && e.password === passIn);

            if (found) {
                currentUser = found;
                showDashboard();
            } else {
                alert("Identifiant ou mot de passe incorrect !");
            }
        }

        // Déconnexion
        function handleLogout() {
            currentUser = null;
            document.getElementById('dashboardPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('loginForm').reset();
        }

        // Afficher le Tableau de bord
        function showDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'block';

            document.getElementById('sessionName').innerText = `${currentUser.firstname} ${currentUser.lastname}`;
            
            // Gestion du badge de session
            const badge = document.getElementById('sessionBadge');
            badge.className = "badge"; 
            badge.innerText = currentUser.grade.toUpperCase();
            if(currentUser.grade === 'dev') badge.classList.add('badge-dev');
            if(currentUser.grade === 'patron') badge.classList.add('badge-patron');
            if(currentUser.grade === 'co-patron') badge.classList.add('badge-copatron');
            if(currentUser.grade === "chef d'équipe") badge.classList.add('badge-chef');
            if(currentUser.grade === 'employé') badge.classList.add('badge-employe');
            if(currentUser.grade === 'recru') badge.classList.add('badge-recru');

            // Visibilité du panneau d'administration (uniquement pour dev, patron, co-patron)
            const adminPanel = document.getElementById('adminPanel');
            if (['dev', 'patron', 'co-patron'].includes(currentUser.grade)) {
                adminPanel.style.display = 'block';
            } else {
                adminPanel.style.display = 'none';
            }

            renderData();
        }

        // Trier et afficher les employés
        function renderData() {
            const tbody = document.getElementById('employeeTableBody');
            const select = document.getElementById('selectEmployee');
            
            tbody.innerHTML = '';
            select.innerHTML = '<option value="">-- Choisir un employé --</option>';

            // Tri par ordre du grade le plus grand au plus petit
            employees.sort((a, b) => {
                return (gradeOrder[a.grade] || 99) - (gradeOrder[b.grade] || 99);
            });

            employees.forEach((emp, index) => {
                // Créer la ligne du tableau
                const tr = document.createElement('tr');
                
                let gradeBadgeClass = 'badge-recru';
                if(emp.grade === 'dev') gradeBadgeClass = 'badge-dev';
                if(emp.grade === 'patron') gradeBadgeClass = 'badge-patron';
                if(emp.grade === 'co-patron') gradeBadgeClass = 'badge-copatron';
                if(emp.grade === "chef d'équipe") gradeBadgeClass = 'badge-chef';
                if(emp.grade === 'employé') gradeBadgeClass = 'badge-employe';

                // Gestion des permissions de modification de la paye
                const isTop3 = ['dev', 'patron', 'co-patron'].includes(currentUser.grade);
                const isOwnProfile = (currentUser.username === emp.username);
                
                // On peut modifier si on fait partie du Top 3 OU si c'est notre PROPRE salaire
                const canModifySalary = isTop3 || isOwnProfile;
                const disabledAttr = canModifySalary ? '' : 'disabled';

                tr.innerHTML = `
                    <td>${emp.firstname} ${emp.lastname}</td>
                    <td><span class="badge ${gradeBadgeClass}">${emp.grade}</span></td>
                    <td>${emp.username}</td>
                    <td>
                        <div class="salary-input-container">
                            <input type="number" class="salary-input" value="${emp.salary}" ${disabledAttr} onchange="updateSalary(${index}, this.value)"> $
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);

                // Ajouter au sélecteur du panneau de gestion (on ne se gère pas soi-même)
                if (currentUser.username !== emp.username) {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.innerText = `${emp.firstname} ${emp.lastname} (${emp.grade})`;
                    select.appendChild(opt);
                }
            });
        }

        // Modifier la paye
        function updateSalary(index, newVal) {
            employees[index].salary = parseInt(newVal) || 0;
            saveData();
        }

        // Recruter / Créer un employé
        function handleCreateEmployee(event) {
            event.preventDefault();
            const fName = document.getElementById('newFirstName').value.trim();
            const lName = document.getElementById('newLastName').value.trim();
            const password = document.getElementById('newPassword').value;
            const grade = document.getElementById('newGrade').value;

            // Règle de l'identifiant : 1ère lettre du prénom + nom entier tout collé
            const firstLetter = fName.charAt(0).toLowerCase();
            const cleanLastName = lName.toLowerCase().replace(/\s+/g, '');
            const username = firstLetter + cleanLastName;

            // Vérification des doublons d'identifiant
            if (employees.some(e => e.username === username)) {
                alert("Erreur : Cet identifiant existe déjà.");
                return;
            }

            employees.push({
                firstname: fName,
                lastname: lName,
                username: username,
                password: password,
                grade: grade,
                salary: 0
            });

            saveData();
            renderData();
            document.getElementById('createProfileForm').reset();
            alert(`Succès ! Employé créé.\nIdentifiant de connexion : ${username}`);
        }

        // Activer les contrôles quand un employé est sélectionné
        function handleSelectEmployee(val) {
            const actionsDiv = document.getElementById('employeeActions');
            if(val === "") {
                actionsDiv.style.display = 'none';
            } else {
                actionsDiv.style.display = 'block';
                // Présélectionner le grade actuel de l'employé dans la liste déroulante
                document.getElementById('changeGradeSelect').value = employees[val].grade;
            }
        }

        // Changer le grade d'un employé
        function changeEmployeeGrade() {
            const index = document.getElementById('selectEmployee').value;
            const newGrade = document.getElementById('changeGradeSelect').value;
            if(index !== "") {
                employees[index].grade = newGrade;
                saveData();
                renderData();
                document.getElementById('employeeActions').style.display = 'none';
                alert("Le grade a bien été modifié !");
            }
        }

        // Virer un employé
        function deleteEmployee() {
            const index = document.getElementById('selectEmployee').value;
            if(index !== "") {
                if(confirm(`Voulez-vous vraiment virer ${employees[index].firstname} ${employees[index].lastname} de l'entreprise ?`)) {
                    employees.splice(index, 1);
                    saveData();
                    renderData();
                    document.getElementById('employeeActions').style.display = 'none';
                    alert("L'employé a été retiré de la liste.");
                }
            }
        }

        // Enregistrer dans le stockage du navigateur
        function saveData() {
            localStorage.setItem('accounting_system_data', JSON.stringify(employees));
        }
    </script>
</body>
</html>
